<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Dark navy background gradient -->
    <radialGradient id="bg" cx="40%" cy="38%" r="65%" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="600">
      <stop offset="0%"   stop-color="#162338"/>
      <stop offset="100%" stop-color="#070d18"/>
    </radialGradient>
    <!-- Teal glow behind the S -->
    <radialGradient id="glow" cx="50%" cy="46%" r="40%">
      <stop offset="0%"   stop-color="#00C9A7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00C9A7" stop-opacity="0"/>
    </radialGradient>
    <!-- Dot grid pattern -->
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.9" fill="#00C9A7" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="0" fill="url(#bg)"/>
  <!-- Dot grid overlay -->
  <rect width="600" height="600" fill="url(#dots)"/>
  <!-- Teal glow -->
  <rect width="600" height="600" fill="url(#glow)"/>

  <!-- Decorative concentric arcs from bottom-left -->
  <circle cx="0"   cy="600" r="180" fill="none" stroke="#00C9A7" stroke-width="0.8" opacity="0.10"/>
  <circle cx="0"   cy="600" r="280" fill="none" stroke="#00C9A7" stroke-width="0.6" opacity="0.07"/>
  <circle cx="0"   cy="600" r="390" fill="none" stroke="#00C9A7" stroke-width="0.5" opacity="0.04"/>
  <!-- Echo arcs top-right -->
  <circle cx="600" cy="0"   r="200" fill="none" stroke="#00C9A7" stroke-width="0.6" opacity="0.06"/>
  <circle cx="600" cy="0"   r="320" fill="none" stroke="#00C9A7" stroke-width="0.5" opacity="0.04"/>

  <!-- Teal ring framing the S -->
  <circle cx="300" cy="262" r="188" fill="none" stroke="#00C9A7" stroke-width="1.5" opacity="0.28"/>
  <circle cx="300" cy="262" r="205" fill="none" stroke="#00C9A7" stroke-width="0.7" opacity="0.12"/>

  <!-- Bold S mark — centred, heavy weight -->
  <text x="300" y="348"
        text-anchor="middle"
        dominant-baseline="auto"
        font-family="'Liberation Sans', 'FreeSans', Arial, sans-serif"
        font-weight="900"
        font-size="280"
        fill="#00C9A7">S</text>

  <!-- Horizontal rule above tagline -->
  <line x1="120" y1="510" x2="480" y2="510"
        stroke="#00C9A7" stroke-width="0.8" opacity="0.25"/>

  <!-- Wordmark tagline -->
  <text x="300" y="545"
        text-anchor="middle"
        font-family="'Liberation Sans', 'FreeSans', Arial, sans-serif"
        font-weight="700"
        font-size="22"
        fill="#FAFAF8"
        fill-opacity="0.55"
        letter-spacing="4">SPEEDWELL.AI</text>

  <!-- Scattered accent particles -->
  <circle cx="148" cy="118" r="1.6" fill="#00C9A7" opacity="0.40"/>
  <circle cx="432" cy="88"  r="1.4" fill="#00C9A7" opacity="0.30"/>
  <circle cx="520" cy="195" r="1.8" fill="#00C9A7" opacity="0.28"/>
  <circle cx="78"  cy="310" r="1.4" fill="#00C9A7" opacity="0.22"/>
  <circle cx="540" cy="380" r="1.2" fill="#00C9A7" opacity="0.20"/>
  <circle cx="185" cy="485" r="1.6" fill="#00C9A7" opacity="0.18"/>
  <circle cx="460" cy="460" r="1.4" fill="#00C9A7" opacity="0.18"/>
</svg>
