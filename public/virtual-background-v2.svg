<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>

    <!-- Background: subtle left-to-right depth -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#14212f"/>
      <stop offset="60%"  stop-color="#0d1a27"/>
      <stop offset="100%" stop-color="#060c13"/>
    </linearGradient>

    <!-- Vignette: darkens all four edges -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>

    <!-- Dot grid -->
    <pattern id="dots" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="40" cy="40" r="1.1" fill="#00C9A7" opacity="0.11"/>
    </pattern>

    <!-- Soft glow behind the logo area (top-left) -->
    <radialGradient id="logoglow" cx="18%" cy="18%" r="38%">
      <stop offset="0%"   stop-color="#00C9A7" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#00C9A7" stop-opacity="0"/>
    </radialGradient>

  </defs>

  <!-- ── Base layers ── -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>

  <!-- ── Arc system — radiates from top-left (matches logo position) ── -->
  <circle cx="0" cy="0" r="300"  fill="none" stroke="#00C9A7" stroke-width="1"   opacity="0.10"/>
  <circle cx="0" cy="0" r="500"  fill="none" stroke="#00C9A7" stroke-width="1"   opacity="0.07"/>
  <circle cx="0" cy="0" r="720"  fill="none" stroke="#00C9A7" stroke-width="0.8" opacity="0.05"/>
  <circle cx="0" cy="0" r="960"  fill="none" stroke="#00C9A7" stroke-width="0.6" opacity="0.03"/>
  <circle cx="0" cy="0" r="1220" fill="none" stroke="#00C9A7" stroke-width="0.5" opacity="0.02"/>

  <!-- ── Arc echo — bottom-right corner ── -->
  <circle cx="1920" cy="1080" r="380"  fill="none" stroke="#00C9A7" stroke-width="0.8" opacity="0.04"/>
  <circle cx="1920" cy="1080" r="620"  fill="none" stroke="#00C9A7" stroke-width="0.6" opacity="0.025"/>

  <!-- ── Scattered static particles ── -->
  <circle cx="312"  cy="98"  r="1.8" fill="#00C9A7" opacity="0.35"/>
  <circle cx="678"  cy="145" r="1.4" fill="#00C9A7" opacity="0.25"/>
  <circle cx="1089" cy="78"  r="1.6" fill="#00C9A7" opacity="0.3"/>
  <circle cx="1456" cy="189" r="1.8" fill="#00C9A7" opacity="0.28"/>
  <circle cx="1734" cy="112" r="1.4" fill="#00C9A7" opacity="0.22"/>
  <circle cx="167"  cy="334" r="1.5" fill="#00C9A7" opacity="0.2"/>
  <circle cx="534"  cy="478" r="1.2" fill="#00C9A7" opacity="0.18"/>
  <circle cx="923"  cy="312" r="1.6" fill="#00C9A7" opacity="0.17"/>
  <circle cx="1289" cy="423" r="1.4" fill="#00C9A7" opacity="0.2"/>
  <circle cx="1645" cy="356" r="1.6" fill="#00C9A7" opacity="0.18"/>
  <circle cx="1878" cy="489" r="1.2" fill="#00C9A7" opacity="0.15"/>
  <circle cx="89"   cy="612" r="1.5" fill="#00C9A7" opacity="0.14"/>
  <circle cx="456"  cy="734" r="1.3" fill="#00C9A7" opacity="0.13"/>
  <circle cx="812"  cy="667" r="1.6" fill="#00C9A7" opacity="0.14"/>
  <circle cx="1178" cy="578" r="1.4" fill="#00C9A7" opacity="0.16"/>
  <circle cx="1567" cy="689" r="1.5" fill="#00C9A7" opacity="0.13"/>
  <circle cx="1845" cy="756" r="1.2" fill="#00C9A7" opacity="0.15"/>

  <!-- ── Glow wash behind logo area ── -->
  <rect width="1920" height="1080" fill="url(#logoglow)"/>

  <!-- ══════════════════════════════════════════════
       BRANDING — top-left, large and clear
       Positioned left so it's visible when your
       webcam feed sits on the right side of frame.
  ══════════════════════════════════════════════ -->

  <!-- Vertical teal accent bar -->
  <rect x="60" y="44" width="3" height="168" rx="1.5" fill="#00C9A7" opacity="0.7"/>

  <!-- Wordmark block -->
  <text x="84" y="120"
        font-family="'Helvetica Neue', 'Arial Black', Arial, sans-serif"
        font-weight="900">
    <!-- "Speedwell" — large, off-white -->
    <tspan font-size="82" fill="#FAFAF8" fill-opacity="0.88" letter-spacing="-2">Speedwell</tspan>
  </text>
  <!-- ".AI" on same baseline, immediately after — teal, slightly smaller -->
  <text x="84" y="120"
        font-family="'Helvetica Neue', 'Arial Black', Arial, sans-serif"
        font-weight="900"
        font-size="82">
    <!-- Spacer tspan to position .AI after "Speedwell" (~680px at this size) -->
    <tspan fill="none">Speedwell</tspan><tspan font-size="52" fill="#00C9A7" fill-opacity="0.95" letter-spacing="4" dx="4">.AI</tspan>
  </text>

  <!-- Tagline -->
  <text x="87" y="160"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-weight="400"
        font-size="22"
        fill="#FAFAF8"
        fill-opacity="0.38"
        letter-spacing="1">
    AI Automation for Growing Businesses
  </text>

  <!-- Horizontal rule below tagline -->
  <line x1="84" y1="182" x2="700" y2="182"
        stroke="#00C9A7" stroke-width="1" opacity="0.25"/>

  <!-- URL -->
  <text x="84" y="208"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-weight="500"
        font-size="18"
        fill="#00C9A7"
        fill-opacity="0.45"
        letter-spacing="2">
    speedwellai.com
  </text>

  <!-- ── Vignette last ── -->
  <rect width="1920" height="1080" fill="url(#vignette)"/>

</svg>
