<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>

    <!-- Main background: lighter center-left, dark edges — depth effect -->
    <radialGradient id="bg" cx="32%" cy="46%" r="62%" gradientUnits="userSpaceOnUse"
                    x1="0" y1="0" x2="1920" y2="1080">
      <stop offset="0%"   stop-color="#162338"/>
      <stop offset="100%" stop-color="#060c14"/>
    </radialGradient>

    <!-- Edge vignette: darkens the perimeter so corners recede -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>

    <!-- Subtle teal dot grid -->
    <pattern id="dots" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="40" cy="40" r="1.1" fill="#00C9A7" opacity="0.13"/>
    </pattern>

  </defs>

  <!-- ── Background layers ── -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>

  <!-- ── Concentric arcs — bottom-left anchor ── -->
  <circle cx="0" cy="1080" r="260"  fill="none" stroke="#00C9A7" stroke-width="1"   opacity="0.09"/>
  <circle cx="0" cy="1080" r="440"  fill="none" stroke="#00C9A7" stroke-width="1"   opacity="0.07"/>
  <circle cx="0" cy="1080" r="620"  fill="none" stroke="#00C9A7" stroke-width="0.8" opacity="0.05"/>
  <circle cx="0" cy="1080" r="820"  fill="none" stroke="#00C9A7" stroke-width="0.8" opacity="0.035"/>
  <circle cx="0" cy="1080" r="1020" fill="none" stroke="#00C9A7" stroke-width="0.5" opacity="0.02"/>

  <!-- ── Concentric arcs — top-right echo ── -->
  <circle cx="1920" cy="0" r="340"  fill="none" stroke="#00C9A7" stroke-width="0.8" opacity="0.045"/>
  <circle cx="1920" cy="0" r="560"  fill="none" stroke="#00C9A7" stroke-width="0.8" opacity="0.03"/>
  <circle cx="1920" cy="0" r="780"  fill="none" stroke="#00C9A7" stroke-width="0.5" opacity="0.018"/>

  <!-- ── Static particles (frozen hero animation) ── -->
  <circle cx="287"  cy="143" r="1.8" fill="#00C9A7" opacity="0.38"/>
  <circle cx="612"  cy="89"  r="1.4" fill="#00C9A7" opacity="0.28"/>
  <circle cx="1034" cy="198" r="1.6" fill="#00C9A7" opacity="0.3"/>
  <circle cx="1389" cy="112" r="2.0" fill="#00C9A7" opacity="0.32"/>
  <circle cx="1723" cy="234" r="1.4" fill="#00C9A7" opacity="0.25"/>
  <circle cx="145"  cy="378" r="1.6" fill="#00C9A7" opacity="0.22"/>
  <circle cx="489"  cy="512" r="1.2" fill="#00C9A7" opacity="0.2"/>
  <circle cx="867"  cy="356" r="1.8" fill="#00C9A7" opacity="0.18"/>
  <circle cx="1256" cy="467" r="1.4" fill="#00C9A7" opacity="0.24"/>
  <circle cx="1612" cy="389" r="1.6" fill="#00C9A7" opacity="0.2"/>
  <circle cx="1867" cy="512" r="1.2" fill="#00C9A7" opacity="0.16"/>
  <circle cx="334"  cy="689" r="1.4" fill="#00C9A7" opacity="0.16"/>
  <circle cx="756"  cy="745" r="1.8" fill="#00C9A7" opacity="0.14"/>
  <circle cx="1145" cy="623" r="1.4" fill="#00C9A7" opacity="0.18"/>
  <circle cx="1534" cy="712" r="1.6" fill="#00C9A7" opacity="0.14"/>
  <circle cx="1812" cy="678" r="1.2" fill="#00C9A7" opacity="0.18"/>
  <circle cx="78"   cy="834" r="1.6" fill="#00C9A7" opacity="0.12"/>
  <circle cx="423"  cy="912" r="1.2" fill="#00C9A7" opacity="0.1"/>
  <circle cx="934"  cy="867" r="1.6" fill="#00C9A7" opacity="0.12"/>
  <circle cx="1378" cy="934" r="1.4" fill="#00C9A7" opacity="0.1"/>
  <circle cx="1689" cy="856" r="1.8" fill="#00C9A7" opacity="0.12"/>

  <!-- ── Bottom branding area ── -->

  <!-- Thin horizontal rule above wordmark -->
  <line x1="1200" y1="1034" x2="1876" y2="1034"
        stroke="#00C9A7" stroke-width="0.75" opacity="0.2"/>

  <!-- Wordmark: "Speedwell" white + ".AI" teal -->
  <text x="1876" y="1059" text-anchor="end"
        font-family="'Helvetica Neue', 'Arial Black', Arial, sans-serif"
        font-weight="800">
    <tspan font-size="30" fill="#FAFAF8" fill-opacity="0.22">Speedwell</tspan><tspan font-size="19" fill="#00C9A7" fill-opacity="0.38" letter-spacing="3">.AI</tspan>
  </text>

  <!-- URL in small muted text -->
  <text x="1876" y="1073" text-anchor="end"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="13"
        fill="#FAFAF8" fill-opacity="0.12"
        letter-spacing="1.5">
    speedwellai.com
  </text>

  <!-- ── Vignette overlay (applied last so it darkens everything equally) ── -->
  <rect width="1920" height="1080" fill="url(#vignette)"/>

</svg>
